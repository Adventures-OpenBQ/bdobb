[package]
name = "pivot-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "AGPL-3.0-only"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
pivot-core = { path = "../pivot-core" }
pivot-wire = { path = "../pivot-wire" }
wasm-bindgen = "=0.2.128"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"
