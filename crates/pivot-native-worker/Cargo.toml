[package]
name = "pivot-native-worker"
version = "0.1.0"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
[dependencies]
pivot-native = { path = "../pivot-native" }
pivot-core = { path = "../pivot-core" }
pivot-wire = { path = "../pivot-wire" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
libc = "=0.2.189"
[[bin]]
name = "pivot-native-worker"
path = "src/main.rs"
[[bin]]
name = "worker-fixture"
path = "tests/support/worker_fixture.rs"
required-features = ["test-fixture"]
[features]
test-fixture = []
