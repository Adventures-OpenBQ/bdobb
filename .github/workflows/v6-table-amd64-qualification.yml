name: V6 managed table AMD64 qualification
on:
  push:
    branches: [codex/v6-table-amd64-qualification]
permissions:
  contents: read
concurrency:
  group: v6-table-amd64-qualification
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: c5d1586f7f15770b59b8068e8e6c0f7ea18e5015
          path: input-source
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: Adventures-OpenBQ/openbq-docker
          ref: 43272c7d8ff2a809c90240036c48a3f8f9f45a1f
          path: backend
          persist-credentials: false
      - name: Prepare the exact recipe source
        run: node backend/table-service/prepare-source.mjs input-source table-context
      - name: Build and qualify actual AMD64 images
        run: python3 scripts/qualify-v6-table-amd64-ci.py
      - name: Preserve qualification receipts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v6-table-amd64-${{ github.run_id }}
          path: qualification-evidence/
          retention-days: 14
          if-no-files-found: error
