name: Windows release qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    name: Windows ${{ matrix.line }}
    runs-on: windows-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix: {"include": [{"line": "v7", "commit": "11a415bdaf589ac2857489e6a32ee8658d5e0cd2", "sourceId": "b3e36e8e5f79fe3d5cdfef3d4c85ee8d08569232b4a642f685b73eb1e342ffbc"}, {"line": "v8", "commit": "c8a9b6aac6bdda5d20194369f7d1e7ad8f0882b2", "sourceId": "88756cbd3ff952505ea8362ea488b42938df47722d16ea74600a4fcca6337498"}, {"line": "v9", "commit": "82197988230bd323400240b4c86334e0c1fd84d4", "sourceId": "8ac4e6b58168bf2d95c0fe4c1165860ff1c5aa40dce4453ef468e69640a023f2"}, {"line": "v10", "commit": "9cded7a12f0303b42f201cd78046249712039beb", "sourceId": "71284d42da9d85e8b6754d91b41253d473f8fee39e82e0c59082b64b930c592a"}]}
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.commit }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown
      - name: Install pinned Wasm glue generator
        run: cargo +1.98.1 install wasm-bindgen-cli --version 0.2.128 --locked --root .pivot-tools
      - run: pnpm pivot:build
      - run: pnpm typecheck
      - name: Build unsigned NSIS installer
        run: pnpm tauri build --ci --no-sign --bundles nsis -- --locked
      - name: Locked native tests
        run: cargo +1.98.1 test --locked --manifest-path src-tauri/Cargo.toml
      - name: Qualify installer and installed application
        shell: pwsh
        env:
          EXPECTED_COMMIT: ${{ matrix.commit }}
          EXPECTED_SOURCE_ID: ${{ matrix.sourceId }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_COMMIT) { throw 'Wrong source commit' }
          $offer = Get-Content source-offer.json -Raw | ConvertFrom-Json
          if ($offer.sourceId -ne $env:EXPECTED_SOURCE_ID) { throw 'Wrong source ID' }
          New-Item -ItemType Directory -Force qualification-output | Out-Null
          @'
          const fs=require('fs'),path=require('path'),zlib=require('zlib');const [root,binary,url,id]=process.argv.slice(2),bin=fs.readFileSync(binary),matches=[];function walk(dir){for(const e of fs.readdirSync(dir,{withFileTypes:true})){const p=path.join(dir,e.name);if(e.isDirectory())walk(p);else if(p.split(path.sep).includes('tauri-codegen-assets')){try{const raw=fs.readFileSync(p),data=zlib.brotliDecompressSync(raw);if(data.includes(Buffer.from(url))&&data.includes(Buffer.from(id)))matches.push({compressedBytes:raw.length,containsSourceUrl:true,containsSourceId:true,embeddedInExecutable:bin.includes(raw)});}catch{}}}}walk(root);if(!matches.some(x=>x.embeddedInExecutable))throw Error('Embedded source identity not verified');console.log(JSON.stringify(matches));
          '@ | Set-Content -Encoding utf8 $env:RUNNER_TEMP/verify-embedded.cjs
          $embedded = & node $env:RUNNER_TEMP/verify-embedded.cjs src-tauri/target/release/build src-tauri/target/release/bdobb.exe $offer.archiveUrl $offer.sourceId
          if ($LASTEXITCODE -ne 0) { throw 'Embedded source check failed' }
          $embedded | Set-Content -Encoding utf8 qualification-output/embedded-source-verification.json
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer' }
          $installer = $installers[0]
          $installDir = Join-Path $env:RUNNER_TEMP 'bdobb-installed-qualification'
          $ip = Start-Process -FilePath $installer.FullName -ArgumentList @('/S',"/D=$installDir") -PassThru
          if (-not $ip.WaitForExit(300000)) { Stop-Process -Id $ip.Id; throw 'Installer exceeded five-minute qualification limit' }
          if ($ip.ExitCode -ne 0) { throw "Installer failed: $($ip.ExitCode)" }
          $installed = @(Get-ChildItem $installDir -Recurse -Filter bdobb.exe)
          if ($installed.Count -ne 1) { throw 'Installed application missing or ambiguous' }
          $builtHash = (Get-FileHash src-tauri/target/release/bdobb.exe -Algorithm SHA256).Hash.ToLower()
          @'
          // Copyright 2026 SecretoftheUniverse.com LLC. SPDX-License-Identifier: AGPL-3.0-only
          const fs = require('fs');
          const crypto = require('crypto');
          const [builtPath, installedPath] = process.argv.slice(2);
          const built = fs.readFileSync(builtPath);
          const installed = fs.readFileSync(installedPath);
          const from = Buffer.from('__TAURI_BUNDLE_TYPE_VAR_UNK');
          const to = Buffer.from('__TAURI_BUNDLE_TYPE_VAR_NSS');
          const at = built.indexOf(from);
          if (at < 0 || from.length !== to.length) throw Error('Expected Tauri bundle marker missing');
          const expected = Buffer.from(built);
          to.copy(expected, at);
          if (!installed.equals(expected)) throw Error('Installed executable differs beyond the exact NSIS bundle marker');
          const hash = b => crypto.createHash('sha256').update(b).digest('hex');
          console.log(JSON.stringify({builtExecutableSha256: hash(built), installedExecutableSha256: hash(installed), expectedNsisExecutableSha256: hash(expected), exactNsisBundleMarkerDelta: true, installedExecutableMatchesExpectedNsisBuild: true}));
          '@ | Set-Content -Encoding utf8 $env:RUNNER_TEMP/verify-nsis.cjs
          $packaging = & node $env:RUNNER_TEMP/verify-nsis.cjs src-tauri/target/release/bdobb.exe $installed[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Installed executable packaging proof failed' }
          $packaging | Set-Content -Encoding utf8 qualification-output/packaged-executable-verification.json
          $packagingProof = $packaging | ConvertFrom-Json
          $installedEmbedded = & node $env:RUNNER_TEMP/verify-embedded.cjs src-tauri/target/release/build $installed[0].FullName $offer.archiveUrl $offer.sourceId
          if ($LASTEXITCODE -ne 0) { throw 'Installed source identity check failed' }
          $installedEmbedded | Set-Content -Encoding utf8 qualification-output/installed-source-verification.json
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'bdobb-windows-release-profile'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'bdobb-windows-release-local-profile'
          New-Item -ItemType Directory -Force $env:APPDATA,$env:LOCALAPPDATA | Out-Null
          $app = Start-Process -FilePath $installed[0].FullName -PassThru
          try { Start-Sleep 30; if ($app.HasExited) { throw "Installed app exited early: $($app.ExitCode)" } } finally { if (-not $app.HasExited) { Stop-Process -Id $app.Id } }
          Copy-Item $installer.FullName qualification-output/
          $hashes = @(@{name=$installer.Name;sha256=(Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower();bytes=$installer.Length})
          $receipt = @{commit=$actual;sourceId=$offer.sourceId;archiveUrl=$offer.archiveUrl;platform='windows-x64';signature='unsigned';installerExitCode=$ip.ExitCode;installedExecutableMatchesExpectedNsisBuild=$true;exactNsisBundleMarkerDelta=$true;installedExecutableSha256=$packagingProof.installedExecutableSha256;builtExecutableSha256=$builtHash;processSmokeSeconds=30;embeddedSourceVerified=$true;lockedNativeTests=$true;artifacts=$hashes} | ConvertTo-Json -Depth 8
          $receipt | Set-Content -Encoding utf8 qualification-output/windows-qualification.json
          Write-Output $receipt
      - run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bdobb-windows-${{ matrix.line }}-${{ matrix.commit }}
          path: qualification-output/
          if-no-files-found: error
          retention-days: 14
