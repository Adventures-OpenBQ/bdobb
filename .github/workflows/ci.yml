name: Windows release qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    name: Windows ${{ matrix.line }}
    runs-on: windows-latest
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix: {"include": [{"line": "v7", "commit": "af195645bd9025b4747c2243be7a59dc4dd83cf6", "sourceId": "96ecc4716f1f6b26555713b09d56390d1f82ef5e1eeb89b616eb130baec42297"}, {"line": "v8", "commit": "0afb755f262cd4e21247d040bb1cc166e73a269d", "sourceId": "cb3032160389fcbeccc9425ef6bb12a6ab5721b809d93c7972a95039e96a8e30"}, {"line": "v9", "commit": "6dbb02cceac4a22168fc0516a194da3c0b6edcc0", "sourceId": "f92ae1ea473a1438416477394b8de39646f31732188b5fc2bfbb7a4bf6c9ff9f"}, {"line": "v10", "commit": "e0692e2ddfbbc52eec40ab9dfed1d292a60b7c55", "sourceId": "ffef22efb43d7ef4f2b02996c8ad39b7188290a28c488c4e9337327a718274c3"}]}
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.commit }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: wasm32-unknown-unknown
      - name: Install pinned Wasm glue generator
        run: cargo +1.98.1 install wasm-bindgen-cli --version 0.2.128 --locked --root .pivot-tools
      - run: pnpm pivot:build
      - run: pnpm typecheck
      - name: Build unsigned NSIS installer
        run: pnpm tauri build --ci --no-sign --bundles nsis -- --locked
      - name: Locked native tests
        run: cargo +1.98.1 test --locked --manifest-path src-tauri/Cargo.toml
      - name: Qualify installer and installed application
        shell: pwsh
        env:
          EXPECTED_COMMIT: ${{ matrix.commit }}
          EXPECTED_SOURCE_ID: ${{ matrix.sourceId }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_COMMIT) { throw 'Wrong source commit' }
          $offer = Get-Content source-offer.json -Raw | ConvertFrom-Json
          if ($offer.sourceId -ne $env:EXPECTED_SOURCE_ID) { throw 'Wrong source ID' }
          New-Item -ItemType Directory -Force qualification-output | Out-Null
          @'
          const fs=require('fs'),path=require('path'),zlib=require('zlib');const [root,binary,url,id]=process.argv.slice(2),bin=fs.readFileSync(binary),matches=[];function walk(dir){for(const e of fs.readdirSync(dir,{withFileTypes:true})){const p=path.join(dir,e.name);if(e.isDirectory())walk(p);else if(p.split(path.sep).includes('tauri-codegen-assets')){try{const raw=fs.readFileSync(p),data=zlib.brotliDecompressSync(raw);if(data.includes(Buffer.from(url))&&data.includes(Buffer.from(id)))matches.push({compressedBytes:raw.length,containsSourceUrl:true,containsSourceId:true,embeddedInExecutable:bin.includes(raw)});}catch{}}}}walk(root);if(!matches.some(x=>x.embeddedInExecutable))throw Error('Embedded source identity not verified');console.log(JSON.stringify(matches));
          '@ | Set-Content -Encoding utf8 $env:RUNNER_TEMP/verify-embedded.cjs
          $embedded = & node $env:RUNNER_TEMP/verify-embedded.cjs src-tauri/target/release/build src-tauri/target/release/bdobb.exe $offer.archiveUrl $offer.sourceId
          if ($LASTEXITCODE -ne 0) { throw 'Embedded source check failed' }
          $embedded | Set-Content -Encoding utf8 qualification-output/embedded-source-verification.json
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer' }
          $installer = $installers[0]
          $installDir = Join-Path $env:RUNNER_TEMP 'bdobb-installed-qualification'
          $ip = Start-Process -FilePath $installer.FullName -ArgumentList @('/S',"/D=$installDir") -Wait -PassThru
          if ($ip.ExitCode -ne 0) { throw "Installer failed: $($ip.ExitCode)" }
          $installed = @(Get-ChildItem $installDir -Recurse -Filter bdobb.exe)
          if ($installed.Count -ne 1) { throw 'Installed application missing or ambiguous' }
          $builtHash = (Get-FileHash src-tauri/target/release/bdobb.exe -Algorithm SHA256).Hash.ToLower()
          if ((Get-FileHash $installed[0].FullName -Algorithm SHA256).Hash.ToLower() -ne $builtHash) { throw 'Installed executable differs from qualified build' }
          $env:APPDATA = Join-Path $env:RUNNER_TEMP 'bdobb-windows-release-profile'
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'bdobb-windows-release-local-profile'
          New-Item -ItemType Directory -Force $env:APPDATA,$env:LOCALAPPDATA | Out-Null
          $app = Start-Process -FilePath $installed[0].FullName -PassThru
          try { Start-Sleep 30; if ($app.HasExited) { throw "Installed app exited early: $($app.ExitCode)" } } finally { if (-not $app.HasExited) { Stop-Process -Id $app.Id } }
          Copy-Item $installer.FullName qualification-output/
          $hashes = @(@{name=$installer.Name;sha256=(Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower();bytes=$installer.Length})
          $receipt = @{commit=$actual;sourceId=$offer.sourceId;archiveUrl=$offer.archiveUrl;platform='windows-x64';signature='unsigned';installerExitCode=$ip.ExitCode;installedExecutableMatches=$true;installedExecutableSha256=$builtHash;processSmokeSeconds=30;embeddedSourceVerified=$true;lockedNativeTests=$true;artifacts=$hashes} | ConvertTo-Json -Depth 8
          $receipt | Set-Content -Encoding utf8 qualification-output/windows-qualification.json
          Write-Output $receipt
      - run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: bdobb-windows-${{ matrix.line }}-${{ matrix.commit }}
          path: qualification-output/
          if-no-files-found: error
          retention-days: 14
