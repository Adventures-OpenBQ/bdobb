name: V4 managed table AMD64 qualification
on:
  push:
    branches: [codex/v4-table-amd64-qualification]
permissions:
  contents: read
concurrency:
  group: v4-table-amd64-qualification
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: e6e58e2555cc434611aa473e2c97578bbd4d25c7
          path: input-source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Adventures-OpenBQ/openbq-docker
          ref: 3c9466a0f675aa532d74456c1eadbd5ad558676d
          path: backend
          persist-credentials: false
      - name: Prepare the exact recipe source
        run: node backend/table-service/prepare-source.mjs input-source table-context
      - name: Build and qualify actual AMD64 images
        run: python3 scripts/qualify-v4-table-amd64-ci.py
      - name: Preserve qualification receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-table-amd64-${{ github.run_id }}
          path: qualification-evidence/
          retention-days: 14
          if-no-files-found: error
