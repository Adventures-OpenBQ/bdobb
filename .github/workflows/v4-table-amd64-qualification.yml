name: V4 managed table AMD64 qualification
on:
  push:
    branches: [codex/v4-table-final-qualification-20261122]
permissions:
  contents: read
concurrency:
  group: v4-table-amd64-qualification
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: b963af1f9be37a1754b7f568403b8c461c5dbc72
          path: input-source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Adventures-OpenBQ/openbq-docker
          ref: fef37add2e044d9eb73408f86ab196105be7fc07
          path: backend
          persist-credentials: false
      - name: Prepare the exact recipe source
        run: node backend/table-service/prepare-source.mjs input-source table-context
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned image scanner and publication extractors
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils 7zip
          python3 input-source/security/install.py
          python3 -m venv .scanner-venv
          .scanner-venv/bin/python -m pip install --require-hashes -r input-source/security/requirements.txt
      - name: Run bounded retention controls
        run: python3 -m unittest discover -s .github/scripts -p test_encrypt_qa_candidates.py -v
      - name: Build and qualify actual AMD64 images
        id: qualify
        run: python3 scripts/qualify-v4-table-amd64-ci.py
      - name: Preserve qualification receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v4-table-amd64-${{ github.run_id }}
          path: |
            qualification-evidence/*.json
            qualification-evidence/qualified-table-image-amd64.tar.gz
          retention-days: 14
          if-no-files-found: error

      - name: Encrypt only the failed immutable AMD64 saved image
        id: encrypted_qa
        if: failure() && steps.qualify.outcome == 'failure'
        run: |
          python3 .github/scripts/encrypt_qa_candidates.py --target table-amd64 --app input-source --auditor input-source --controller .             --recipient age160m7enkqn7g3gy9sm66keanjfsnkjfs2u6ce57w3jzz8egvm7erq39zaqx             --outdir "$RUNNER_TEMP/v4-encrypted-qa-table-amd64" --failure-stage image-privacy --qualification-outcome failure
      - name: Gate ciphertext and safe image-retention receipt only
        id: encrypted_outbound
        if: failure() && steps.encrypted_qa.outcome == 'success'
        run: |
          .scanner-venv/bin/python input-source/security/gate.py --repo input-source artifacts "$RUNNER_TEMP/v4-encrypted-qa-table-amd64/retention.json" "$RUNNER_TEMP/v4-encrypted-qa-table-amd64/qa-blocked-v4-table-amd64.tar.age"
      - name: Retain encrypted failed AMD64 image for one day
        if: failure() && steps.encrypted_qa.outcome == 'success' && steps.encrypted_outbound.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: QA-ENCRYPTED-BLOCKED-v4-table-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/v4-encrypted-qa-table-amd64/retention.json
            ${{ runner.temp }}/v4-encrypted-qa-table-amd64/qa-blocked-v4-table-amd64.tar.age
          if-no-files-found: error
          retention-days: 1
