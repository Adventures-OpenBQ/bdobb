name: V9 managed table AMD64 qualification
on:
  push:
    branches: [codex/v9-release-assembly]
    paths:
      - .github/workflows/v9-table-amd64-qualification.yml
      - scripts/qualify-v9-table-amd64-ci.py
      - deploy/table-service/runtime-smoke.mjs
permissions:
  contents: read
concurrency:
  group: v9-table-amd64-qualification
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: 6f941390ad8cd344cb36592304b7df489c531589
          path: input-source
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: Adventures-OpenBQ/openbq-docker
          ref: 27463e5efb2919bc75c55e1106c2c31e0234e113
          path: backend
          persist-credentials: false
      - name: Prepare the exact recipe source
        run: node backend/table-service/prepare-source.mjs input-source table-context
      - name: Build and qualify actual AMD64 images
        run: python3 scripts/qualify-v9-table-amd64-ci.py
      - name: Preserve qualification receipts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: v9-table-amd64-${{ github.run_id }}
          path: qualification-evidence/
          retention-days: 14
          if-no-files-found: error
