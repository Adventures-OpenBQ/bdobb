[package]
name = "bdobb"
version = "5.0.0"
description = "BDOBB"
edition = "2021"
license = "AGPL-3.0-only"

[lib]
name = "bdobb_lib"
crate-type = ["rlib"]

[features]
# pnpm tauri dev --features mcp-bridge --config src-tauri/tauri.mcp.conf.json
mcp-bridge = ["dep:tauri-plugin-mcp-bridge"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Lets an MCP client drive the running desktop app (screenshots, clicks, DOM,
# console). It opens a control port, so it is optional, off by default, and
# registered only in debug builds; scripts/release.sh refuses to build with it.
tauri-plugin-mcp-bridge = { version = "=0.13.2", optional = true }
serde = { version = "1", features = ["derive"] }

# The Save panel's Format pop-up (src/save_panel.rs). Already in the lock
# through tauri and rfd; listed for the AppKit classes the panel uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSSavePanel", "NSPanel", "NSWindow", "NSResponder", "NSView", "NSControl", "NSButton", "NSPopUpButton", "NSTextField", "NSMenu", "NSMenuItem"] }
